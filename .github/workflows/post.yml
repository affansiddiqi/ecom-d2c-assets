name: Post Reel

# Every 30 minutes. The script decides whether anything is actually due.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ecom-d2c-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish anything that is due
        env:
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          MAX_PER_RUN: "1"
        run: python3 post.py

      - name: Save what was posted
        if: always()
        run: |
          if [[ -n "$(git status --porcelain queue.json videos)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A queue.json videos
            git commit -m "chore: record posted reels, drop spent videos [skip ci]"
            git push
          else
            echo "Nothing posted this run."
          fi
